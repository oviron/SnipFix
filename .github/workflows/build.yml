name: Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Linux, gcc and clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./build.sh test
      - run: HOSTCC=clang ./build.sh test

  mingw:
    name: Build (MinGW-w64 GCC, portability check)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - run: ./build.sh

  clang:
    name: Build (LLVM-MinGW clang, release binary)
    runs-on: ubuntu-latest
    needs: test
    env:
      LLVM_MINGW: '20261006'
    steps:
      - uses: actions/checkout@v5
      - name: Install llvm-mingw ${{ env.LLVM_MINGW }}
        run: |
          url=$(curl -fsSL "https://api.github.com/repos/mstorsjo/llvm-mingw/releases/tags/$LLVM_MINGW" |
                jq -r '.assets[].browser_download_url | select(test("ucrt-ubuntu-[0-9.]+-x86_64\\.tar\\.xz$"))' | head -1)
          test -n "$url"
          curl -fsSL "$url" | tar xJ
          echo "$PWD/$(ls -d llvm-mingw-*/ | head -1)bin" >> "$GITHUB_PATH"
      - run: CC=x86_64-w64-mingw32-clang ./build.sh
      - name: Check imports and PE security flags
        run: |
          # only KnownDLLs, nothing loadable from the folder SnipFix runs from
          dlls=$(llvm-readobj --coff-imports build/SnipFix.exe | sed -n 's/^ *Name: \(.*\.dll\)$/\1/p' | tr 'A-Z' 'a-z' | sort | tr '\n' ' ')
          echo "imports: $dlls"
          test "$dlls" = "advapi32.dll gdi32.dll kernel32.dll shell32.dll user32.dll "
          flags=$(llvm-readobj --file-headers build/SnipFix.exe)
          for f in IMAGE_DLL_CHARACTERISTICS_DYNAMIC_BASE IMAGE_DLL_CHARACTERISTICS_NX_COMPAT IMAGE_DLL_CHARACTERISTICS_HIGH_ENTROPY_VA; do
            echo "$flags" | grep -q "$f" || { echo "missing $f"; exit 1; }
          done
      - run: cd build && sha256sum SnipFix.exe | tee SnipFix.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SnipFix
          path: |
            build/SnipFix.exe
            build/SnipFix.exe.sha256

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [ clang, mingw ]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SnipFix
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            SnipFix.exe
            SnipFix.exe.sha256
